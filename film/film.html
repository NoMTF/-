<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Capra;src:url(assets/fonts/Caprasimo-Regular.ttf)}
@font-face{font-family:OpenSans;src:url(assets/fonts/OpenSans.ttf);font-weight:300 800;font-stretch:75% 100%}
@font-face{font-family:Caveat;src:url(assets/fonts/Caveat.ttf);font-weight:400 700}
@font-face{font-family:Nunito;src:url(assets/fonts/Nunito.ttf);font-weight:200 1000}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#EA6218}
#bgtex{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 45%,rgba(255,190,120,.16),rgba(255,160,90,0) 60%),radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(90,25,0,.32) 100%)}
#bgov{position:absolute;inset:0;z-index:5}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.card{border-radius:28px;overflow:hidden;box-shadow:0 22px 46px rgba(70,20,0,.38),0 4px 10px rgba(70,20,0,.25);background:#fff}
.card .kb{width:100%;height:100%;transform-origin:50% 50%}
.card svg,.free svg{display:block;width:100%;height:100%}
.free{filter:drop-shadow(0 14px 18px rgba(70,20,0,.35))}
.free.noshadow{filter:none}
.txt{display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap}
.capra{font-family:Capra;color:#fff;text-shadow:0 6px 0 rgba(90,30,0,.25)}
.dark{color:#3b1f0e}
.os{font-family:OpenSans;font-weight:800}
.nun{font-family:Nunito;font-weight:900}
.cav{font-family:Caveat;font-weight:700}
.label{font-family:Nunito;font-weight:900;color:#3b1f0e;background:#fff;border-radius:999px;padding:0 34px;box-shadow:0 8px 18px rgba(70,20,0,.3)}
.ch{display:inline-block;transform-origin:50% 80%}
</style></head><body>
<div id="stage"><div id="bgtex"></div><div id="bgov"></div></div>
<script src="geo.js"></script><script src="timeline.js"></script>
<script src="lib.js"></script><script src="art_chars.js"></script><script src="art.js"></script><script src="scenes.js"></script>
<script>document.fonts.ready.then(()=>{window.READY=true;});</script>
</body></html>
